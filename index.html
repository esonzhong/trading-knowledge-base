<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>交易知识库</title>
  <style>
    :root {
      color-scheme: dark light;
      --bg: #0d1117;
      --panel: #151b23;
      --text: #eef3fb;
      --muted: #96a5bb;
      --line: #2a3648;
      --accent: #f2b84b;
    }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      display: grid;
      place-items: center;
      padding: 24px;
    }
    main {
      width: min(760px, 100%);
      border: 1px solid var(--line);
      background: var(--panel);
      border-radius: 8px;
      padding: 28px;
    }
    h1 { margin: 0 0 8px; font-size: 28px; }
    p { margin: 0 0 22px; color: var(--muted); line-height: 1.7; }
    a {
      display: inline-flex;
      align-items: center;
      min-height: 42px;
      padding: 0 16px;
      border-radius: 8px;
      background: var(--accent);
      color: #111827;
      text-decoration: none;
      font-weight: 800;
    }
  </style>
</head>
<body>
  <main>
    <h1>交易知识库</h1>
    <p>这里集中管理交易闪卡、笔记页面和后续工具。当前已整理好统一闪卡库。</p>
    <a href="./flashcards/index.html">打开闪卡库</a>
  </main>
</body>
</html>
